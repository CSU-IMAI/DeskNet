[package]
name = "desknest"
version = "1.0.0"
description = "DeskNest desktop file and application manager"
authors = ["DeskNest"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desknest_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
trash = "5"
open = "5"
dirs = "6"
shell-words = "1"
aes-gcm = "0.10"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
rand = "0.8"
hex = "0.4"
png = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
file_icon_provider = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
